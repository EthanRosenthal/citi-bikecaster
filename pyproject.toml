[project]
name = "bikecaster"
version = "2.0.0"
description = "Log Citi Bike GBFS station status to S3 as DuckDB/Athena-friendly parquet"
requires-python = ">=3.14"
dependencies = ["pyarrow>=21"]

[dependency-groups]
dev = ["boto3", "moto[s3]>=5", "pytest", "duckdb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bikecaster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real GBFS API (deselect with -m 'not live')"]
